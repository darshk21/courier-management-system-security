name: OWASP ZAP Security Scan

on:
  push:
    branches:
      - final-secured-version
  pull_request:
    branches:
      - final-secured-version
  workflow_dispatch:

jobs:
  zap-security-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: royal_express_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install PHP and MySQL support
        run: |
          sudo apt-get update
          sudo apt-get install -y php php-mysql mysql-client

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -u root --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Import Courier Management Database
        run: |
          mysql -h 127.0.0.1 -u root royal_express_db < Database/royal_express_db.sql

      - name: Start Courier Management System
        run: |
          php -S 0.0.0.0:8080 > php-server.log 2>&1 &
          sleep 5

      - name: Verify Application
        run: |
          curl -I http://127.0.0.1:8080/

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8080/"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-security-report